{% extends 'base.html' %}{% block content %}<section class="listing search-page"><p class="eyebrow">FIND YOUR NEXT FAVORITE</p><h1>The recipe collection.</h1><p class="search-intro">A flavor in mind? An ingredient to use up? Start here.</p><label for="recipe-search">Search drinks and ingredients</label><input id="recipe-search" type="search" placeholder="Try mango, espresso or lemonade" data-index="{{ link('/search-index.json') }}">
<div class="search-controls"><label>Drink type<select id="category-filter"><option value="">All drinks</option>{% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}</select></label><label>Sort by<select id="sort-filter"><option value="newest">Newest first</option><option value="title">Name: A–Z</option></select></label><button id="saved-filter" aria-pressed="false">Saved recipes only</button><button id="clear-filters" class="quiet-button">Clear filters</button></div>
<p class="save-note">Saved recipes stay in this browser. No account needed.</p><p id="search-status" role="status">Loading the recipe collection…</p><div id="search-results" class="grid"></div><noscript><p>JavaScript is needed for search and saved recipes. <a href="{{ link('/recipes/') }}">Browse all recipes</a>.</p></noscript></section>{% endblock %}
