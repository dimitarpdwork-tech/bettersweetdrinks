{% extends 'base.html' %}{% block content %}<section class="listing search-page"><p class="eyebrow">FIND YOUR NEXT FAVORITE</p><h1>The recipe collection.</h1><p class="search-intro">A flavor in mind? An ingredient to use up? Start here.</p><label for="recipe-search">Search drinks and ingredients</label><input id="recipe-search" type="search" placeholder="Try mango, espresso or lemonade" data-index="{{ link('/search-index.json') }}">
<div class="search-controls"><label>Drink type<select id="category-filter"><option value="">All drinks</option>{% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}</select></label><label>Alcohol<select id="alcohol-filter"><option value="">Any</option><option value="alcoholic">Alcoholic</option><option value="non-alcoholic">Non-alcoholic</option></select></label><label>Time<select id="time-filter"><option value="">Any time</option><option value="10">10 min or less</option><option value="15">15 min or less</option></select></label><label>Base<select id="spirit-filter"><option value="">Any base</option><option value="vodka">Vodka</option><option value="gin">Gin</option><option value="rum">Rum</option><option value="tequila">Tequila</option><option value="whiskey">Whiskey</option><option value="brandy">Brandy/Cognac</option><option value="wine">Wine/Sparkling</option><option value="other">Other alcohol</option></select></label><label>Style<select id="flavor-filter"><option value="">Any style</option><option value="coffee">Coffee</option><option value="fruity">Fruity</option><option value="creamy">Creamy</option><option value="sparkling">Sparkling</option></select></label><label>Calories<select id="calorie-filter"><option value="">All calorie ranges</option><option value="under-100">Under 100 kcal</option><option value="100-199">100–199 kcal</option><option value="200-plus">200+ kcal</option></select></label><label>Sort by<select id="sort-filter"><option value="newest">Newest first</option><option value="title">Name: A–Z</option><option value="calories-asc">Calories: low to high</option><option value="calories-desc">Calories: high to low</option><option value="abv-asc">ABV: low to high</option><option value="abv-desc">ABV: high to low</option></select></label><button id="saved-filter" aria-pressed="false">Saved recipes only</button><button id="clear-filters" class="quiet-button">Clear filters</button></div>
<p class="save-note">Saved recipes stay in this browser. No account needed.</p><p id="search-status" role="status">Loading the recipe collection…</p><div id="search-results" class="grid"></div><div class="load-more-wrap"><button type="button" class="quiet-button load-more" id="search-more" hidden>Load more recipes</button></div><noscript><p>JavaScript is needed for search and saved recipes. <a href="{{ link('/recipes/') }}">Browse all recipes</a>.</p></noscript></section>{% endblock %}
