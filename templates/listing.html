{% extends 'base.html' %}{% block content %}<section class="listing"><h1 class="{% if path=='/' %}sr-only{% endif %}">{{ title }}</h1>{% include 'cards.html' %}
{% if pages and pages > 1 %}<nav class="pagination" aria-label="Recipe pages">{% for n in range(1,pages+1) %}<a {% if n==page %}aria-current="page"{% endif %} href="{{ link('/' if n==1 else '/page/'+n|string+'/') }}">{{ n }}</a>{% endfor %}</nav>{% endif %}</section>{% endblock %}
