<div class="grid">{% for p in items %}<article class="card"><a href="{{ link(p.url) }}" tabindex="-1" aria-hidden="true">{% if p.featuredImage %}<img src="{{ link(p.featuredImage) }}" alt="{{ p.featuredImageAlt }}" loading="lazy" width="720" height="540">{% endif %}</a><h2><a href="{{ link(p.url) }}">{{ p.title }}</a></h2><p class="byline">By {{ p.author }} · <time datetime="{{ p.publishDate }}">{{ p.publishDate }}</time></p><p>{{ p.description[:180] }}{% if p.description|length > 180 %}…{% endif %}</p><a class="read-more" href="{{ link(p.url) }}">Read recipe<span class="sr-only">: {{ p.title }}</span></a></article>{% endfor %}</div>
